# Copy to .streamlit/secrets.toml (gitignored) for a local test, or paste into the app's
# "Secrets" box on Streamlit Community Cloud. Only needed when the database is not on disk.

# Where to download the slim app database made by scripts/export_app_db.py.
# A private GitHub release asset uses the API URL:
#   https://api.github.com/repos/<owner>/<repo>/releases/assets/<asset id>
# Any direct download link works too.
NBA_DB_URL = "https://api.github.com/repos/OWNER/nba-similarity-data/releases/assets/123456789"

# Read-only token for a private source (a fine-grained GitHub token with Contents: read on the
# data repository). Leave out for a public or pre-signed URL.
NBA_DB_TOKEN = "github_pat_..."
