[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-similarity"
version = "0.1.0"
description = "Find the most statistically similar NBA player-seasons in history."
requires-python = ">=3.11"

[project.scripts]
nba-ingest = "nba_similarity.ingestion.cli:main"
nba-features = "nba_similarity.features.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
